name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production
    runs-on: self-hosted
    timeout-minutes: 30
    environment:
      name: production
      url: https://h-dashboard.ir

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP syntax
        run: find app bootstrap config routes src -name "*.php" -exec php -l {} \;

      - name: Install Composer dependencies
        run: |
          composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Install Node dependencies & build frontend
        run: |
          npm ci
          npm run build

      - name: Clear Laravel caches
        run: |
          php artisan view:clear
          php artisan config:clear
          php artisan route:clear
          php artisan cache:clear

      - name: Optimize Laravel
        run: |
          php artisan optimize
          php artisan optimize:queues

      - name: Run pending migrations
        run: |
          php artisan migrate --force --no-interaction

      - name: Reload Apache
        run: sudo systemctl reload apache2

      - name: Verify deployment
        run: curl -f https://h-dashboard.ir/health || exit 1
        continue-on-error: true

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed"
          exit 1

      - name: Notify on success
        if: success()
        run: echo "✅ Deployment successful"
