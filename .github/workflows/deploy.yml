name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  lint:
    name: Code Style (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:latest

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: h_dashboard_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:latest
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pgsql, redis, pcntl, bcmath, zip, curl, mbstring
          coverage: pcov
          tools: composer:latest

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Copy .env for testing
        run: |
          cp .env.example .env.testing
          # Match the CI service containers (postgres: postgres/secret/h_dashboard_test, redis: no password).
          # CACHE_STORE must be non-shared: Laravel 13 reads CACHE_STORE (not the legacy
          # CACHE_DRIVER in .env.example); leaving it on redis shares spatie's permission
          # cache between parallel test processes and cross-pollutes their separate DBs.
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=h_dashboard_test/; s/^DB_USERNAME=.*/DB_USERNAME=postgres/; s/^DB_PASSWORD=.*/DB_PASSWORD=secret/; s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=/; s/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env.testing
          grep -q '^CACHE_STORE=' .env.testing || echo 'CACHE_STORE=array' >> .env.testing

      - name: Generate application key
        run: php artisan key:generate --env=testing

      - name: Run migrations
        run: php artisan migrate --env=testing --force

      - name: Clear cached config/routes
        run: |
          php artisan config:clear --env=testing
          php artisan route:clear --env=testing

      - name: Run tests with coverage
        run: ./vendor/bin/pest --parallel --coverage --min=80 --coverage-clover=coverage.xml

  phpstan:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pgsql, redis, pcntl, bcmath, zip, curl, mbstring
          tools: composer:latest

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  deploy:
    name: Deploy Production
    needs: [lint, test, phpstan]
    runs-on: self-hosted
    timeout-minutes: 30
    environment:
      name: production
      url: https://h-dashboard.ir

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP syntax
        run: find app bootstrap config routes src -name "*.php" -exec php -l {} \;

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Install Node dependencies & build frontend
        run: |
          npm ci
          npm run build

      - name: Clear Laravel caches
        run: |
          php artisan view:clear
          php artisan config:clear
          php artisan route:clear
          php artisan cache:clear

      - name: Optimize Laravel
        run: |
          php artisan optimize
          php artisan optimize:queues

      - name: Run pending migrations
        run: php artisan migrate --force --no-interaction

      - name: Reload Apache
        run: sudo systemctl reload apache2

      - name: Verify deployment
        run: curl -f https://h-dashboard.ir/health || exit 1
        continue-on-error: true

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed"
          exit 1

      - name: Notify on success
        if: success()
        run: echo "✅ Deployment successful"
