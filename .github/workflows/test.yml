name: Tests

on:
  pull_request:
    branches: [main, beta, test]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Style (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:latest

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: h_dashboard_test
        options: >
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:latest
        options: >
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pgsql, redis, pcntl, bcmath, zip, curl, mbstring
          coverage: pcov
          tools: composer:latest

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Copy .env for testing
        run: |
          cp .env.example .env.testing
          # Match the CI service containers (postgres: postgres/secret/h_dashboard_test, redis: no password).
          # CACHE_STORE must be non-shared: Laravel 13 reads CACHE_STORE (not the legacy
          # CACHE_DRIVER in .env.example); leaving it on redis shares spatie's permission
          # cache between parallel test processes and cross-pollutes their separate DBs.
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=h_dashboard_test/; s/^DB_USERNAME=.*/DB_USERNAME=postgres/; s/^DB_PASSWORD=.*/DB_PASSWORD=secret/; s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=/; s/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env.testing
          grep -q '^CACHE_STORE=' .env.testing || echo 'CACHE_STORE=array' >> .env.testing

      - name: Generate application key
        run: php artisan key:generate --env=testing

      - name: Run migrations
        run: php artisan migrate --env=testing --force

      # A stale bootstrap/cache/routes-v7.php built with a DIFFERENT APP_KEY
      # makes every Livewire ->set()/->call() silently no-op in Pest (all
      # mutations appear to fail). CI always starts from a fresh checkout,
      # but keep this guard so the same trap can never fire here either.
      - name: Clear cached config/routes before tests
        run: |
          php artisan config:clear --env=testing
          php artisan route:clear --env=testing
          php artisan view:clear

      - name: Run tests with coverage
        run: ./vendor/bin/pest --parallel --coverage --min=80 --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking signal for now: the mutation job has never passed — the
    # suite has no covers()/mutates() declarations and mutation mode trips
    # over lookup-table id collisions. Treat failures as informational until
    # the job is properly wired up.
    continue-on-error: true

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: h_dashboard_test
        options: >
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:latest
        options: >
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pgsql, redis, pcntl, bcmath, zip, curl, mbstring
          tools: composer:latest

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Copy .env for testing
        run: |
          cp .env.example .env.testing
          # Match the CI service containers (postgres: postgres/secret/h_dashboard_test, redis: no password).
          # CACHE_STORE must be non-shared: Laravel 13 reads CACHE_STORE (not the legacy
          # CACHE_DRIVER in .env.example); leaving it on redis shares spatie's permission
          # cache between parallel test processes and cross-pollutes their separate DBs.
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=h_dashboard_test/; s/^DB_USERNAME=.*/DB_USERNAME=postgres/; s/^DB_PASSWORD=.*/DB_PASSWORD=secret/; s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=/; s/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env.testing
          grep -q '^CACHE_STORE=' .env.testing || echo 'CACHE_STORE=array' >> .env.testing

      - name: Generate application key
        run: php artisan key:generate --env=testing

      - name: Run migrations
        run: php artisan migrate --env=testing --force

      - name: Run mutation tests
        # @covers declarations scope mutations to tested code.
        # No --min threshold: the job is informational (continue-on-error: true)
        # and reports the mutation score without blocking PRs.
        run: ./vendor/bin/pest --mutate --parallel --covered-only

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: example_6162e0f827d119b0
          POSTGRES_DB: h_dashboard
          POSTGRES_USER: h_dashboard
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:latest
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pgsql, redis, pcntl, bcmath, zip, curl, mbstring
          tools: composer:latest

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Configure .env for E2E
        run: |
          # Build .env.e2e for Playwright (dotenv reads this file directly)
          {
            echo "APP_NAME=h-dashboard"
            echo "APP_ENV=local"
            echo "APP_DEBUG=true"
            echo "APP_URL=http://127.0.0.1:8001"
            echo "APP_LOCALE=fa"
            echo "APP_FALLBACK_LOCALE=en"
            echo "APP_FAKER_LOCALE=en_US"
            echo "APP_MAINTENANCE_DRIVER=file"
            echo "PHP_CLI_SERVER_WORKERS=4"
            echo "BCRYPT_ROUNDS=12"
            echo "LOG_CHANNEL=stack"
            echo "LOG_STACK=single"
            echo "LOG_DEPRECATIONS_CHANNEL=null"
            echo "LOG_LEVEL=debug"
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=h_dashboard"
            echo "DB_USERNAME=h_dashboard"
            echo "DB_PASSWORD=example_6162e0f827d119b0"
            echo "APP_TIMEZONE=Asia/Tehran"
            echo "SESSION_LIFETIME=120"
            echo "SESSION_ENCRYPT=false"
            echo "SESSION_SECURE_COOKIE=false"
            echo "SESSION_PATH=/"
            echo "SESSION_DOMAIN=null"
            echo "BROADCAST_CONNECTION=log"
            echo "FILESYSTEM_DISK=local"
            echo "CACHE_DRIVER=redis"
            echo "SESSION_DRIVER=redis"
            echo "QUEUE_CONNECTION=redis"
            echo "REDIS_HOST=127.0.0.1"
            echo "REDIS_PORT=6379"
            echo "REDIS_PASSWORD="
            echo "ZABBIX_URL=http://127.0.0.1:8443/api_jsonrpc.php"
            echo "ZABBIX_TOKEN="
            echo "DEBUGBAR_ENABLED=false"
            echo "TEST_N_CODE=4411015056"
            echo "TEST_PASSWORD=12345678"
            echo "TEST_USER_NAME=\"E2E Admin\""
            echo "TEST_UNIT_MANAGER_N_CODE=4400176134"
            echo "TEST_EXPERT_N_CODE=4400176143"
            echo "TEST_REGULAR_USER_N_CODE=1000000001"
          } > .env.e2e
          # Also use it as .env for PHP artisan commands
          cp .env.e2e .env
          # Generate APP_KEY (key:generate needs it in .env)
          php artisan key:generate --force
          # Write the generated key back to .env.e2e for Playwright
          grep '^APP_KEY=' .env >> .env.e2e || true

      - name: Clear caches
        run: |
          php artisan config:clear
          php artisan route:clear

      - name: Run migrations and seed
        run: php artisan migrate:fresh --seed --force

      - name: Create password-mutation user
        run: |
          RUN_ID=$(date +%s%N | cut -b1-13)
          PWD_NCODE="9${RUN_ID: -9}"
          UNIT_NAME="E2E-${RUN_ID}"
          export TEST_PASSWORD=12345678
          php tests/e2e/create-pwd-user.php "$PWD_NCODE" "$TEST_PASSWORD" "$UNIT_NAME"
          echo "{\"runId\":\"$RUN_ID\",\"pwdNCode\":\"$PWD_NCODE\"}" > tests/e2e/.run-state.json

      - name: Start PHP server
        run: php artisan serve --port=8001 &
        env:
          APP_ENV: local

      - name: Wait for server
        run: |
          for i in $(seq 1 20); do
            if curl -s -o /dev/null http://localhost:8001/login 2>/dev/null; then
              echo "Server ready"
              break
            fi
            sleep 1
          done

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: BASE_URL=http://localhost:8001 npx playwright test --config=playwright.config.ts
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  phpstan:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pgsql, redis, pcntl, bcmath, zip, curl, mbstring
          tools: composer:latest

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress
